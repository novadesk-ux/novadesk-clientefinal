<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaDesk · Admin</title>
<style>
:root{--r:#ef4444;--bg:#0b0b0d;--c:#151518;--b:#2a2a2f;--t:#f4f4f5;--m:#a1a1aa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:#0b0b0dee;border-bottom:1px solid var(--b);backdrop-filter:blur(8px)}
h1{font-size:16px;margin:0}h1 span{color:var(--r)}h3{margin:18px 0 8px;font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px}nav button{white-space:nowrap}
main{padding:0 14px 90px;max-width:1000px;margin:auto}
button{font:inherit;background:var(--c);color:var(--t);border:1px solid var(--b);border-radius:9px;padding:7px 12px;cursor:pointer}
button.on,button.p{background:var(--r);border-color:var(--r);font-weight:700}button.x{color:var(--r);padding:4px 8px}
input,select,textarea{font:inherit;width:100%;background:#0f0f12;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:7px 9px}
input[type=checkbox]{width:auto}textarea{min-height:60px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:10px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;color:var(--m);font-size:12px;margin-bottom:3px}
.tw{overflow-x:auto}table{border-collapse:collapse;min-width:640px;width:100%}td,th{padding:3px;font-size:12px;color:var(--m);font-weight:400;text-align:left}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*{flex:1}.row>button{flex:0 0 auto}
.note{color:var(--m);font-size:12px;margin:4px 0}
#lg{max-width:340px;margin:12vh auto;padding:20px}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#16a34a;padding:9px 16px;border-radius:99px;display:none;z-index:9}
#sv{position:fixed;bottom:14px;right:14px;z-index:6;padding:12px 20px;box-shadow:0 6px 24px #0008}
img.pv{width:40px;height:40px;object-fit:contain;background:#222;border-radius:8px}
</style><script src="firebase-config.js"></script></head><body>
<div id="lg" class="card"><h1>Nova<span>Desk</span> · Admin</h1><p class="note">Entra con el correo y la clave que creaste en Firebase.</p>
<label>Correo</label><input id="em" type="email"><label style="margin-top:8px">Clave</label><input id="pw" type="password"><p id="er" class="note" style="color:var(--r)"></p><button class="p" id="go" style="width:100%">Entrar</button></div>
<div id="app" hidden><header><h1>Nova<span>Desk</span> · Admin</h1><div><a href="index.html" target="_blank"><button>Ver tienda</button></a> <button id="out">Salir</button></div></header>
<nav id="nv"></nav><main id="mn"></main><button class="p" id="sv">💾 Guardar cambios</button></div><div id="toast"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const T="novadesk",$=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=initializeApp(window.FB),auth=getAuth(app),db=getFirestore(app),ref=d=>doc(db,"tiendas",T,"catalogo",d);
const D=()=>({tienda:{nombre:"NovaDesk",wa:"584145364023",h1:"Lun–Sáb 11:30 a. m. – 11:45 p. m.",h2:"Dom 2:00 p. m. – 11:45 p. m.",kick:"ENTRETENIMIENTO SIN LÍMITES",t1:"Tus plataformas favoritas, ",t2:"listas hoy mismo",sub:"Planes de streaming con entrega rápida y soporte por WhatsApp 💬",ig:"@novadesk_ve",color:"#ef4444"},cats:[],serv:[],desc:{1:0,3:.1,6:.15,12:.2},pagos:[],camps:[],combos:[],cauto:{activo:false,min:2,pct:10},faq:[]});
let S=D(),L={tienda:"",serv:{}},tab="tienda";
const TABS=[["tienda","🏪 Tienda"],["serv","🎬 Servicios y planes"],["desc","🏷️ Descuentos"],["camps","🔥 Ofertas"],["combos","🎁 Combos"],["pagos","💳 Pagos"],["faq","❓ FAQ"],["logos","🖼️ Logos"]];
const get=(o,p)=>p.split(".").reduce((a,k)=>a?.[k],o);
function set(p,v){const k=p.split("."),l=k.pop(),o=k.reduce((a,x)=>a[x]??(a[x]={}),S);if(v===""||v==null||(typeof v==="number"&&isNaN(v)))delete o[l];else o[l]=v;
 const m=p.match(/^(.*)\.meses\.\d+$/);if(m){const pl=get(S,m[1]);if(pl.meses&&!Object.keys(pl.meses).length)delete pl.meses}}
const I=(p,t="text",ph="")=>{let v=get(S,p);if(t==="chk")return`<input type="checkbox" data-p="${p}" data-t="chk" ${v?"checked":""}>`;
 if(t==="pct")v=v==null?"":+(v*100).toFixed(2);if(t==="dt")v=v?new Date(new Date(v)-new Date(v).getTimezoneOffset()*6e4).toISOString().slice(0,16):"";
 const ty={n:"number",pct:"number",dt:"datetime-local"}[t]||"text";return`<input type="${ty}" ${ty==="number"?'step="0.01"':""} data-p="${p}" data-t="${t}" value="${esc(v)}" placeholder="${ph}">`};
const SEL=(p,opts,r)=>{const v=get(S,p);const o=opts.map(x=>Array.isArray(x)?x:[x,x]);if(v!=null&&v!==""&&!o.some(x=>String(x[0])===String(v)))o.push([v,v]);
 return`<select data-p="${p}" data-t="${typeof opts[0]==="object"&&!Array.isArray(opts[0])?"s":"s"}" ${r?"data-r=1":""}>${o.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===String(v??"")?"selected":""}>${esc(b)}</option>`).join("")}</select>`};
const F=(l,h)=>`<div><label>${l}</label>${h}</div>`;
const add=(p,v,l)=>`<button data-a="push:${p}" data-v='${esc(JSON.stringify(v)).replace(/'/g,"&#39;")}'>＋ ${l}</button>`;
const del=p=>`<button class="x" data-a="del:${p}">✕</button>`;
const sn=()=>S.serv.map(s=>s.n),pl=n=>(S.serv.find(s=>s.n===n)?.planes||[]).map(x=>x.label);
const V={
tienda:()=>`<div class="card g">${F("Nombre de la tienda",I("tienda.nombre"))}${F("WhatsApp (solo números, con 58)",I("tienda.wa"))}${F("Instagram",I("tienda.ig"))}${F("Color principal (#hex)",I("tienda.color","text","#ef4444"))}${F("Horario línea 1",I("tienda.h1"))}${F("Horario línea 2",I("tienda.h2"))}${F("Texto pequeño del banner",I("tienda.kick"))}${F("Título 1",I("tienda.t1"))}${F("Título 2 (resaltado)",I("tienda.t2"))}${F("Subtítulo",I("tienda.sub"))}</div><p class="note">El banner principal (imagen NOVA DESK) está fijo en el código de la tienda.</p>`,
serv:()=>`<h3>Categorías</h3><div class="card">${S.cats.map((c,i)=>`<div class="row">${I("cats."+i)}${del("cats."+i)}</div>`).join("")}${add("cats","Nueva categoría","Categoría")}<p class="note">Para Recargas y Juegos usa la categoría «Juegos y Recargas» y crea cada juego como un servicio con planes marcados «Fijo».</p></div><h3>Servicios</h3>`+
 S.serv.map((s,i)=>`<div class="card"><div class="g">${F("Servicio",I(`serv.${i}.n`))}${F("Categoría",SEL(`serv.${i}.cat`,S.cats))}${F("Color (#hex)",I(`serv.${i}.color`))}<div style="align-self:end">${del("serv."+i)}</div></div>
 <div class="tw"><table><tr><th>Plan / modalidad</th><th>Precio $/mes</th><th>Oferta $</th><th>Fijo</th><th>$ 1 mes</th><th>$ 3m</th><th>$ 6m</th><th>$ 12m</th><th></th></tr>${(s.planes||[]).map((p,j)=>{const b=`serv.${i}.planes.${j}`;return`<tr><td>${I(b+".label")}</td><td>${I(b+".precio","n")}</td><td>${I(b+".oferta","n")}</td><td>${I(b+".fijo","chk")}</td>${[1,3,6,12].map(m=>`<td>${I(b+".meses."+m,"n")}</td>`).join("")}<td>${del(b)}</td></tr>`}).join("")}</table></div>
 ${add(`serv.${i}.planes`,{label:"Nuevo plan",precio:0},"Plan")}<p class="note">Fijo = sin selector de meses (recargas). Los precios por mes son opcionales y reemplazan el cálculo con descuento.</p></div>`).join("")+add("serv",{n:"Nuevo servicio",cat:S.cats[0]||"",color:"#ef4444",planes:[]},"Servicio"),
desc:()=>`<h3>Descuento por cantidad de meses (%)</h3><div class="card g">${[1,3,6,12].map(m=>F(m===12?"1 año":m+(m===1?" mes":" meses"),I("desc."+m,"pct"))).join("")}</div>
 <h3>Descuento automático por combinar servicios</h3><div class="card g">${F("Activo",I("cauto.activo","chk"))}${F("Mínimo de servicios distintos",I("cauto.min","n"))}${F("Descuento %",I("cauto.pct","n"))}</div>`,
camps:()=>S.camps.map((c,i)=>`<div class="card"><div class="g">${F("Nombre",I(`camps.${i}.nombre`))}${F("Termina",I(`camps.${i}.hasta`,"dt"))}${F("Activa",I(`camps.${i}.activa`,"chk"))}<div style="align-self:end">${del("camps."+i)}</div></div>
 ${(c.items||[]).map((it,j)=>{const b=`camps.${i}.items.${j}`;return`<div class="row">${SEL(b+".s",sn(),1)}${SEL(b+".l",pl(it.s))}${SEL(b+".m",[["","Cualquier plazo"],[1,"1 mes"],[3,"3 meses"],[6,"6 meses"],[12,"1 año"]])}${I(b+".p","n","Precio oferta $")}${del(b)}</div>`}).join("")}
 ${add(`camps.${i}.items`,{s:sn()[0]||"",l:pl(sn()[0])[0]||"",p:0},"Producto en oferta")}</div>`).join("")+`<button data-a="camp">＋ Nueva oferta</button><p class="note">La oferta se muestra con cuenta regresiva hasta la fecha indicada.</p>`,
combos:()=>S.combos.map((c,i)=>`<div class="card"><div class="g">${F("Nombre",I(`combos.${i}.nombre`))}${F("Plazo",SEL(`combos.${i}.m`,[[1,"1 mes"],[3,"3 meses"],[6,"6 meses"],[12,"1 año"]]))}${F("Descuento %",I(`combos.${i}.pct`,"n"))}${F("Activo",I(`combos.${i}.activo`,"chk"))}<div style="align-self:end">${del("combos."+i)}</div></div>
 ${(c.items||[]).map((it,j)=>{const b=`combos.${i}.items.${j}`;return`<div class="row">${SEL(b+".s",sn(),1)}${SEL(b+".l",pl(it.s))}${del(b)}</div>`}).join("")}${add(`combos.${i}.items`,{s:sn()[0]||"",l:pl(sn()[0])[0]||""},"Servicio al combo")}</div>`).join("")+add("combos",{nombre:"Nuevo combo",m:1,pct:10,activo:true,items:[]},"Combo"),
pagos:()=>`<div class="card">${S.pagos.map((p,i)=>`<div class="row">${I(`pagos.${i}.n`,"text","Método")}${I(`pagos.${i}.min`,"n","Mínimo $ (opcional)")}${del("pagos."+i)}</div>`).join("")}${add("pagos",{n:"Nuevo método"},"Método de pago")}</div>`,
faq:()=>S.faq.map((f,i)=>`<div class="card">${F("Pregunta",I(`faq.${i}.q`))}<label style="margin-top:6px">Respuesta</label><textarea data-p="faq.${i}.a" data-t="text">${esc(f.a)}</textarea>${del("faq."+i)}</div>`).join("")+add("faq",{q:"Nueva pregunta",a:""},"Pregunta"),
logos:()=>`<div class="card"><div class="row"><img class="pv" src="${esc(L.tienda)}" alt=""><span>Logo de la tienda</span><input type="file" accept="image/*" data-logo="__t"></div>${S.serv.map(s=>`<div class="row"><img class="pv" src="${esc(L.serv[s.n]||"")}" alt=""><span>${esc(s.n)}</span><input type="file" accept="image/*" data-logo="${esc(s.n)}"></div>`).join("")}<p class="note">Si no subes logo, se usa el que ya trae la tienda. Se redimensionan solos.</p></div>`};
function render(){$("#nv").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" data-tab="${k}">${l}</button>`).join("");$("#mn").innerHTML=V[tab]()}
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2500)};
document.addEventListener("input",e=>{const el=e.target,p=el.dataset.p;if(!p)return;const t=el.dataset.t;let v=el.value;
 if(t==="n")v=v===""?"":+v;else if(t==="pct")v=v===""?"":+v/100;else if(t==="chk")v=el.checked;else if(t==="dt")v=v?new Date(v).toISOString():"";else if(/^(.*\.)?m$/.test(p)&&v!==""&&!isNaN(v))v=+v;
 const cm=p.match(/^cats\.(\d+)$/);if(cm){const o=S.cats[cm[1]];S.serv.forEach(s=>{if(s.cat===o)s.cat=v})}
 set(p,v);if(el.dataset.r)render()});
document.addEventListener("change",e=>{const el=e.target;if(!el.dataset.logo||!el.files[0])return;const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,160/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const u=c.toDataURL("image/png");el.dataset.logo==="__t"?L.tienda=u:L.serv[el.dataset.logo]=u;render()};im.src=fr.result};fr.readAsDataURL(el.files[0])});
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();return}const a=b.dataset.a;if(!a)return;
 if(a==="camp"){S.camps.push({id:Date.now().toString(36),nombre:"Nueva oferta",activa:true,hasta:new Date(Date.now()+6048e5).toISOString(),items:[]})}
 else if(a.startsWith("push:")){const p=a.slice(5),arr=get(S,p);arr.push(JSON.parse(b.dataset.v))}
 else if(a.startsWith("del:")){if(!confirm("¿Eliminar?"))return;const k=a.slice(4).split("."),i=+k.pop();get(S,k.join(".")).splice(i,1)}
 render()});
async function save(){for(const s of S.serv)for(const p of s.planes||[])if(p.precio==null&&!p.meses){alert(`Falta el precio en «${s.n} · ${p.label}»`);return}
 try{await setDoc(ref("config"),{json:JSON.stringify(S)});await setDoc(ref("logos"),{json:JSON.stringify(L)});toast("Guardado ✔ (la tienda se actualiza al recargar)")}catch(e){alert("No se pudo guardar: "+e.message)}}
async function load(){try{const [c,l]=await Promise.all([getDoc(ref("config")),getDoc(ref("logos"))]);
 if(c.exists())S={...D(),...JSON.parse(c.data().json)};else{const r=await fetch("seed.json");S={...D(),...await r.json()};toast("Catálogo inicial cargado: pulsa Guardar")}
 if(l.exists())L={tienda:"",serv:{},...JSON.parse(l.data().json)}}catch(e){alert("Error al cargar: "+e.message)}render()}
$("#sv").onclick=save;$("#out").onclick=()=>signOut(auth);
$("#go").onclick=()=>signInWithEmailAndPassword(auth,$("#em").value,$("#pw").value).catch(()=>$("#er").textContent="Correo o clave incorrectos");
onAuthStateChanged(auth,u=>{$("#lg").hidden=!!u;$("#app").hidden=!u;if(u)load()});
</script></body></html>
